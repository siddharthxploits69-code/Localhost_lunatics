<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vertity AI Copilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 390px;
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      font-size: 12px;
      line-height: 1.45;
    }
    .header {
      padding: 12px 14px;
      background: linear-gradient(135deg, rgba(99,102,241,0.22), rgba(6,182,212,0.14));
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 9px; }
    .logo {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 14px; color: #fff;
    }
    .title { font-weight: 800; font-size: 13px; color: #fff; }
    .subtitle { font-size: 10px; color: #94a3b8; }
    .score-pill {
      padding: 4px 10px; border-radius: 9999px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 800; font-size: 12px;
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .score-pill.warn { background: rgba(245,158,11,0.16); color: #fbbf24; border-color: rgba(245,158,11,0.35); }
    .score-pill.danger { background: rgba(239,68,68,0.16); color: #f87171; border-color: rgba(239,68,68,0.35); }
    .controls {
      padding: 10px 14px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    select {
      flex: 1;
      background: #020617;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 11px;
    }
    .toggle-label {
      display: flex; align-items: center; gap: 6px; font-size: 11px; color: #cbd5e1; cursor: pointer;
    }
    .actions {
      display: flex; gap: 6px;
    }
    button {
      border: none; border-radius: 8px; padding: 7px 10px;
      font-size: 11px; font-weight: 700; cursor: pointer; transition: opacity 0.15s ease;
    }
    button:hover { opacity: 0.92; }
    .btn-primary { flex: 1; background: linear-gradient(90deg, #6366f1, #4f46e5); color: #fff; }
    .btn-cyan { background: rgba(6,182,212,0.18); color: #22d3ee; border: 1px solid rgba(6,182,212,0.38); }
    .btn-green { background: rgba(16,185,129,0.18); color: #34d399; border: 1px solid rgba(16,185,129,0.4); }
    .body {
      padding: 12px 14px;
      max-height: 310px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card {
      background: #0f172a; border: 1px solid #1e293b; border-radius: 10px; padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .card-top { display: flex; justify-content: space-between; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .cat { color: #38bdf8; }
    .sev-high { color: #fca5a5; }
    .sev-medium { color: #fcd34d; }
    .cite {
      font-size: 10px; color: #a5b4fc;
      background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.25);
      border-radius: 6px; padding: 4px 7px;
    }
    .exp { font-size: 11px; color: #cbd5e1; }
    .fix-box {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 6px 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
    }
    .bad { color: #f87171; text-decoration: line-through; }
    .good { color: #34d399; font-weight: 700; }
    .footer {
      padding: 10px 14px;
      background: #0f172a;
      border-top: 1px solid #1e293b;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .link { color: #38bdf8; text-decoration: none; font-size: 11px; font-weight: 600; }
    .status-banner {
      font-size: 11px; color: #94a3b8; background: #0f172a; border: 1px solid #1e293b;
      border-radius: 8px; padding: 8px 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">V</div>
      <div>
        <div class="title">Vertity AI Copilot</div>
        <div class="subtitle" id="popup-platform">Detecting active editor...</div>
      </div>
    </div>
    <div class="score-pill" id="popup-score">100/100</div>
  </div>

  <div class="controls">
    <div class="row">
      <select id="backend-select" title="Vertity AI Backend Server">
        <option value="https://vertity-ai.onrender.com">Cloud Live (vertity-ai.onrender.com)</option>
        <option value="http://127.0.0.1:8000">Localhost (127.0.0.1:8000)</option>
      </select>
      <label class="toggle-label">
        <input type="checkbox" id="autolint-toggle" checked>
        <span>Auto-Lint</span>
      </label>
    </div>
    <div class="actions">
      <button class="btn-primary" id="btn-scan">Scan Active Editor</button>
      <button class="btn-cyan" id="btn-fix-all">Fix All</button>
      <button class="btn-green" id="btn-queue">Send to Queue</button>
    </div>
  </div>

  <div class="body" id="popup-body">
    <div class="status-banner">Scanning current page editor...</div>
  </div>

  <div class="footer">
    <span id="popup-status-msg" style="color:#94a3b8;font-size:10px;">v3.0.0 · Grounded Rulebook Sync</span>
    <a href="#" class="link" id="open-dashboard-link">Open Dashboard ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
